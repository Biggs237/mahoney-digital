<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultation | Heritage Home Partners</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap');.display{font-family:'Playfair Display',Georgia,serif}</style>
</head>
<body class="bg-stone-50 text-stone-800">
    <div class="bg-stone-900 text-stone-300 text-center text-xs py-2 px-3"><strong class="text-white/90">Signature tier</strong> · <a href="/" class="text-amber-400 underline">Mahoney Digital</a></div>
    <header class="bg-white border-b sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <a href="/examples/heritage-home-partners/" class="display font-semibold text-lg text-stone-900">Heritage Home Partners</a>
            <nav class="flex flex-wrap gap-x-3 gap-y-1 text-xs sm:text-sm font-medium text-stone-600">
                <a href="/examples/heritage-home-partners/">Home</a>
                <a href="/examples/heritage-home-partners/services.html">Services</a>
                <a href="/examples/heritage-home-partners/projects.html">Projects</a>
                <a href="/examples/heritage-home-partners/process.html">Process</a>
                <a href="/examples/heritage-home-partners/about.html">About</a>
                <a href="/examples/heritage-home-partners/reviews.html">Reviews</a>
                <a href="/examples/heritage-home-partners/contact.html" class="bg-stone-900 text-white px-3 py-1.5 rounded-lg">Consultation</a>
            </nav>
        </div>
    </header>
    <main class="max-w-md mx-auto px-4 py-10">
        <h1 class="display text-3xl font-bold text-stone-900 mb-2 text-center">Schedule a consultation</h1>
        <p class="text-center text-sm text-stone-600 mb-6">Tell us about your project. We’ll follow up within one business day.</p>
        <form class="space-y-3" onsubmit="event.preventDefault(); alert('Demo form — real builds send this to the owner.');">
            <input type="text" placeholder="Name" class="w-full px-4 py-3 rounded-lg border border-stone-300 text-sm min-h-[48px]" required>
            <input type="tel" placeholder="Phone" class="w-full px-4 py-3 rounded-lg border border-stone-300 text-sm min-h-[48px]" required>
            <textarea placeholder="Project notes" rows="3" class="w-full px-4 py-3 rounded-lg border border-stone-300 text-sm"></textarea>
            <button type="submit" class="w-full bg-amber-600 text-stone-950 font-bold py-3.5 rounded-xl min-h-[48px]">Request consultation</button>
        </form>
    </main>
    <footer class="bg-stone-950 text-stone-500 text-center text-sm py-6"><p class="text-stone-300 font-semibold display">Heritage Home Partners</p></footer>
    <script defer src="/assets/vercel-insights.js"></script>
</body>
</html>

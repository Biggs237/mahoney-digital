<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 168" role="img" aria-label="Casto's Auto Repair — Fueled by Faith">
  <defs>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#f4f4f4"/>
      <stop offset="45%" stop-color="#bdbdbd"/>
      <stop offset="72%" stop-color="#6e6e6e"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
    <linearGradient id="redRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3b40"/>
      <stop offset="55%" stop-color="#e31e24"/>
      <stop offset="100%" stop-color="#a91519"/>
    </linearGradient>
    <linearGradient id="blackRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="chromeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <text x="170" y="62" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', 'Pacifico', cursive" font-size="58" font-weight="700" fill="url(#chrome)" stroke="#111111" stroke-width="1.6" filter="url(#chromeShadow)">Casto's</text>
  <g filter="url(#ribbonShadow)">
    <path d="M 24 78 C 44 66, 68 66, 88 72 L 252 72 C 272 66, 296 66, 316 78 L 316 96 C 296 108, 272 108, 252 102 L 88 102 C 68 108, 44 108, 24 96 Z" fill="url(#redRibbon)" stroke="#7a1013" stroke-width="1"/>
    <path d="M 24 78 L 36 84 L 36 90 L 24 96 Z" fill="#8f1418"/>
    <path d="M 316 78 L 304 84 L 304 90 L 316 96 Z" fill="#8f1418"/>
    <path d="M 88 72 L 98 76 L 98 98 L 88 102 Z" fill="#ffffff" opacity="0.12"/>
  </g>
  <text x="170" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" letter-spacing="3.8" fill="#ffffff">AUTO REPAIR</text>
  <g filter="url(#ribbonShadow)">
    <path d="M 42 112 C 92 138, 248 138, 298 112 C 308 118, 314 126, 314 134 C 248 162, 92 162, 26 134 C 26 126, 32 118, 42 112 Z" fill="url(#blackRibbon)" stroke="#000000" stroke-width="1"/>
    <path d="M 42 112 C 32 118, 28 124, 30 130 C 48 120, 58 114, 42 112 Z" fill="#000000"/>
    <path d="M 298 112 C 308 118, 312 124, 310 130 C 292 120, 282 114, 298 112 Z" fill="#000000"/>
  </g>
  <text x="170" y="138" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0.5">Fueled by Faith</text>
</svg>
[build]
  publish = "."

[[forms]]
  name = "contact"

[build.processing.html]
  pretty_urls = true

# Custom 404: Netlify serves 404.html automatically for missing pages.
# Do not add a catch-all /* → 404 redirect — it can break form POST handling.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Mahoney Digital</title>
    <meta name="description" content="Get in touch with Mahoney Digital — websites and digital help for local businesses. Call (740) 530-8790 or send a message.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2217%22 fill=%22%230b1120%22/><text x=%2250%22 y=%2265%22 font-size=%2258%22 font-family=%22Inter, system-ui, sans-serif%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22>M</text></svg>">
    <link rel="stylesheet" href="/assets/site.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; background: #f8f6f1; }
        .heading-font { font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif; font-weight: 600; letter-spacing: -0.025em; }
        .btn-primary { background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%); }
        .nav-link:hover { color: #0d9488; }
        .hero-mesh { background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(13,148,136,0.22), transparent 55%), #0b1120; }
        input, textarea { font-family: inherit; }
    </style>
</head>
<body class="bg-cream min-h-screen flex flex-col">
    <nav class="bg-white/95 border-b border-cream-dark sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-5 h-16 flex justify-between items-center">
            <a href="/" class="flex items-center gap-x-3 leading-none">
                <svg width="32" height="32" viewBox="0 0 256 256" class="block" aria-hidden="true"><rect x="16" y="16" width="224" height="224" rx="44" fill="#0b1120"/><text x="128" y="168" font-family="Inter, system-ui, sans-serif" font-size="128" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.06em">M</text></svg>
                <span class="font-semibold text-lg tracking-tighter text-ink">Mahoney Digital</span>
            </a>
            <a href="tel:7405308790" class="text-sm font-semibold text-brand-dark">(740) 530-8790</a>
        </div>
    </nav>

    <header class="hero-mesh text-white">
        <div class="max-w-3xl mx-auto px-5 py-12 md:py-16 text-center">
            <a href="/" class="text-sm text-slate-400 hover:text-white inline-flex items-center gap-2 mb-6"><i class="fas fa-arrow-left text-xs"></i> Home</a>
            <h1 class="heading-font text-3xl md:text-4xl font-semibold tracking-tight mb-3">Ready to talk?</h1>
            <p class="text-slate-400 text-lg">No pressure. No sales script. Tell me what you need.</p>
        </div>
    </header>

    <main class="flex-1 max-w-xl mx-auto px-5 py-12 w-full">
        <form name="contact" method="POST" action="https://formsubmit.co/hello@mahoneydigital.net" class="space-y-5 bg-white border border-cream-dark rounded-3xl p-6 md:p-8">
            <input type="hidden" name="_subject" value="New lead — mahoneydigital.net contact form">
            <input type="hidden" name="_next" value="https://mahoneydigital.net/thank-you.html">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="true">
            <input type="text" name="_honey" class="hidden" tabindex="-1" autocomplete="off" aria-hidden="true">

            <div class="grid sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Your name</label>
                    <input type="text" name="name" required autocomplete="name" class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:border-brand-dark focus:ring-1 focus:ring-brand/30 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Phone</label>
                    <input type="tel" name="phone" required autocomplete="tel" class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:border-brand-dark focus:ring-1 focus:ring-brand/30 outline-none">
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Email</label>
                <input type="email" name="email" required autocomplete="email" class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:border-brand-dark focus:ring-1 focus:ring-brand/30 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">What kind of work do you do?</label>
                <input type="text" name="business-type" placeholder="Plumbing, HVAC, lawn..." class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:border-brand-dark focus:ring-1 focus:ring-brand/30 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">What are you looking for?</label>
                <textarea name="message" rows="5" required class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:border-brand-dark focus:ring-1 focus:ring-brand/30 outline-none resize-y"></textarea>
            </div>
            <button type="submit" class="btn-primary w-full py-4 rounded-2xl text-white font-semibold">Send message</button>
        </form>
        <p class="text-center text-sm text-slate-500 mt-6">
            Or call/text <a href="tel:7405308790" class="font-semibold text-brand-dark hover:underline">(740) 530-8790</a>
            · <a href="mailto:hello@mahoneydigital.net" class="hover:underline">hello@mahoneydigital.net</a>
        </p>
    </main>

    <footer class="bg-ink text-slate-400 text-sm py-8 mt-auto">
        <div class="max-w-6xl mx-auto px-5 text-center">
            <a href="/" class="text-white font-semibold hover:underline">Mahoney Digital</a>
        </div>
    </footer>
        <link rel="stylesheet" href="/assets/chatbot.css">
    <script defer src="/assets/chatbot.js"></script>
    <script defer src="/assets/vercel-insights.js"></script>
</body>
</html>

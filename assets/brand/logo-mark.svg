<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <!-- Mahoney Digital primary mark -->
  <!-- Rounded square container (matches site nav rounded-2xl aesthetic) -->
  <rect x="16" y="16" width="224" height="224" rx="44" fill="#0b1120"/>
  <!-- Bold M monogram, optically centered -->
  <text 
    x="128" 
    y="168" 

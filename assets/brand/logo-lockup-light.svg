<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" fill="none">
  <!-- Mahoney Digital lockup for dark backgrounds (reversed) -->
  
  <!-- Mark: rounded square with M (light version) -->
  <rect x="0" y="8" width="164" height="164" rx="32" fill="#ffffff"/>
  <text 
    x="82" 
    y="108" 
    font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="92" 
    font-weight="700" 
    fill="#0b1120" 
    text-anchor="middle" 
    dominant-baseline="middle"
    letter-spacing="-0.06em">M</text>
  
  <!-- Wordmark (light on dark) -->
  <text 
    x="200" 
    y="102" 
    font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="64" 
    font-weight="700" 
    fill="#ffffff" 
    letter-spacing="-0.03em">Mahoney Digital</text>
</svg>
